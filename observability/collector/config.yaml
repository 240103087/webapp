# OpenTelemetry Collector (#103): one OTLP endpoint for the app, three backends behind it.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch: {}

exporters:
  otlphttp/prometheus: # Prometheus 3 takes OTLP metrics natively
    endpoint: http://prometheus:9090/api/v1/otlp
    tls: { insecure: true }
  otlphttp/loki: # Loki 3 takes OTLP logs natively
    endpoint: http://loki:3100/otlp
    tls: { insecure: true }
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }

service:
  pipelines:
    metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp/prometheus] }
    logs: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp/loki] }
    traces: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp/tempo] }
