openapi: 3.0.3
info:
  title: MoveEasy Memory Tags API
  version: 1.0.0
  description: |
    The contract between the frontend services layer (`frontend/src/api/`) and the
    backend (`backend/`). Derived in iteration 2 from the mock services layer that
    the frontend was built and tested against in iteration 1.

    - Every `operationId` is the name of the matching method of the `Api`
      interface in `frontend/src/api/types.ts`. `backend/test/openapi.test.ts`
      checks that the two lists are the same.
    - Owner calls need `Authorization: Bearer <token>` from sign up or log in.
    - Visitors have no account. The browser sends a random `X-Visitor-Id` (used
      for PIN attempt limits and scan counting) and, after a correct PIN, the
      tag's `X-Unlock-Token`.
    - Times are ISO 8601 strings in UTC. Ids are opaque strings.
    - Every error has the `ApiErrorBody` shape.
    - Media files are served from signed URLs returned in `Media.url`, so `<img>`,
      `<video>` and `<audio>` can load them without headers.
servers:
  - url: http://localhost:8787
    description: Local backend (the Vite dev server proxies `/api` to it)
tags:
  - name: auth
  - name: tags
  - name: media
  - name: replies
  - name: moves
  - name: public
    description: Pages a visitor sees after scanning a QR code. No account needed.
  - name: system

paths:
  /api/health:
    get:
      tags: [system]
      operationId: health
      x-not-in-api: true
      summary: Liveness check
      responses:
        "200":
          description: The server is up
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, example: true }

  # ---------------------------------------------------------------- auth
  /api/auth/signup:
    post:
      tags: [auth]
      operationId: signUp
      summary: Create an account and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignUpInput" }
      responses:
        "201":
          description: Account created, logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "409": { $ref: "#/components/responses/EmailTaken" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/auth/login:
    post:
      tags: [auth]
      operationId: logIn
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogInInput" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: Wrong email or password (`bad_credentials`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorBody" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logOut
      summary: End the current session
      security: [{ bearer: [] }]
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/me:
    get:
      tags: [auth]
      operationId: me
      summary: The logged-in user
      description: The client turns a 401 into `null` (not logged in).
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The user of this token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- tags
  /api/tags:
    get:
      tags: [tags]
      operationId: listTags
      summary: My tags, filtered and sorted
      security: [{ bearer: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Words in the title, case-insensitive" }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/TagKind" } }
        - { name: moveId, in: query, schema: { type: string } }
        - { name: archived, in: query, schema: { type: boolean, default: false }, description: "true: only archived tags; false: only active ones" }
        - { name: sort, in: query, schema: { type: string, enum: [newest, scans], default: newest } }
      responses:
        "200":
          description: Tags of the logged-in user
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Tag" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [tags]
      operationId: createTag
      summary: Create a tag; the server picks its code (and box number for a box)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/tags/{tagId}:
    parameters: [{ $ref: "#/components/parameters/TagId" }]
    get:
      tags: [tags]
      operationId: getTag
      summary: One of my tags, with media
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The tag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [tags]
      operationId: updateTag
      summary: Replace a tag's fields. The code never changes; a box keeps its number while it stays in the same move
      description: With `privacy` = `pin`, leaving `pin` empty keeps the current PIN.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [tags]
      operationId: deleteTag
      summary: Delete a tag with its media files, replies and scans. Box numbers are not reused
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tags/{tagId}/archive:
    parameters: [{ $ref: "#/components/parameters/TagId" }]
    put:
      tags: [tags]
      operationId: setArchived
      summary: Archive or unarchive a tag
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [archived]
              properties:
                archived: { type: boolean }
      responses:
        "200":
          description: The tag with its new status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/stats:
    get:
      tags: [tags]
      operationId: getStats
      summary: Dashboard counters
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Counters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- media
  /api/tags/{tagId}/media:
    parameters: [{ $ref: "#/components/parameters/TagId" }]
    post:
      tags: [media]
      operationId: uploadMedia
      summary: Upload one photo, video or audio file
      description: |
        Limits (from `MEDIA_LIMITS` in `shared/src/schemas.ts`): photos JPEG/PNG/WebP up to
        10 MB, videos MP4/WebM up to 50 MB, audio MP3/M4A/WebM/OGG/WAV up to 20 MB,
        at most 20 items per tag. Codec parameters in the type (`audio/webm;codecs=opus`) are ignored.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                caption: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Media" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The tag already has 20 media items (`too_many_media`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorBody" }
        "413":
          description: File larger than the limit for its type (`too_big`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorBody" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/tags/{tagId}/media/order:
    parameters: [{ $ref: "#/components/parameters/TagId" }]
    put:
      tags: [media]
      operationId: reorderMedia
      summary: Set the order of all media items of a tag
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaIds]
              properties:
                mediaIds:
                  type: array
                  description: Every media id of the tag exactly once, in the new order
                  items: { type: string }
      responses:
        "200":
          description: Media in the new order
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Media" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/tags/{tagId}/media/{mediaId}:
    parameters: [{ $ref: "#/components/parameters/TagId" }, { $ref: "#/components/parameters/MediaId" }]
    patch:
      tags: [media]
      operationId: updateMedia
      summary: Change a caption
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caption]
              properties:
                caption: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Media" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [media]
      operationId: deleteMedia
      summary: Delete a media item and its file
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/media/{mediaId}/file:
    parameters: [{ $ref: "#/components/parameters/MediaId" }]
    get:
      tags: [media]
      operationId: mediaFile
      x-not-in-api: true
      summary: The file itself, from a signed URL
      description: |
        Not called by the services layer: the browser loads it from `Media.url` /
        `PublicMedia.url`, which the server signs for 24 hours. Supports `Range`
        requests so video and audio can seek.
      parameters:
        - { name: exp, in: query, required: true, schema: { type: integer }, description: "Expiry, Unix seconds" }
        - { name: sig, in: query, required: true, schema: { type: string }, description: HMAC of the media id and `exp` }
        - { name: Range, in: header, schema: { type: string, example: "bytes=0-" } }
      responses:
        "200":
          description: The whole file
          content:
            "*/*":
              schema: { type: string, format: binary }
        "206":
          description: Part of the file
          content:
            "*/*":
              schema: { type: string, format: binary }
        "403":
          description: Signature wrong or expired (`bad_signature`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorBody" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- replies (owner)
  /api/tags/{tagId}/replies:
    parameters: [{ $ref: "#/components/parameters/TagId" }]
    get:
      tags: [replies]
      operationId: listReplies
      summary: Replies to my tag, newest first
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Replies
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Reply" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tags/{tagId}/replies/read:
    parameters: [{ $ref: "#/components/parameters/TagId" }]
    post:
      tags: [replies]
      operationId: markRepliesRead
      summary: Mark every reply of the tag as read
      security: [{ bearer: [] }]
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tags/{tagId}/replies/{replyId}:
    parameters:
      - { $ref: "#/components/parameters/TagId" }
      - { name: replyId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [replies]
      operationId: deleteReply
      summary: Delete a reply
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- moves
  /api/moves:
    get:
      tags: [moves]
      operationId: listMoves
      summary: My moves, newest first
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Moves
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Move" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [moves]
      operationId: createMove
      summary: Create a move
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Move" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/moves/{moveId}:
    parameters: [{ $ref: "#/components/parameters/MoveId" }]
    get:
      tags: [moves]
      operationId: getMove
      summary: A move with its boxes grouped by room ("No room" last)
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The move
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoveDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [moves]
      operationId: updateMove
      summary: Change a move's name, addresses or date
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Move" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [moves]
      operationId: deleteMove
      summary: Delete a move that has no boxes
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The move still has boxes (`move_not_empty`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorBody" }
  /api/moves/{moveId}/search:
    parameters: [{ $ref: "#/components/parameters/MoveId" }]
    get:
      tags: [moves]
      operationId: searchMove
      summary: Where is my kettle? Boxes whose contents, title or room match every word
      security: [{ bearer: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 80 } }
      responses:
        "200":
          description: Matching boxes, by box number
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MoveSearchHit" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  # ---------------------------------------------------------------- public
  /api/public/tags/{code}:
    parameters: [{ $ref: "#/components/parameters/Code" }]
    get:
      tags: [public]
      operationId: getPublicTag
      summary: What a visitor sees after scanning
      description: |
        Decided by `visitorView` in `shared/src/access.ts`, in this order: unknown,
        archived, private, time-locked, PIN required, open. The owner (valid bearer
        token) always gets `open` with `preview: true`. Before the open date the
        message and media are not sent at all. An `open` view by a visitor counts
        a scan, at most once per visitor per tag every 30 minutes.
        Unknown codes return 200 with `state: unknown`, so the page can show a
        friendly message and a field to type another code.
      security: [{}, { bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/VisitorId"
        - $ref: "#/components/parameters/UnlockToken"
      responses:
        "200":
          description: The view for this visitor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTagView" }
  /api/public/tags/{code}/unlock:
    parameters: [{ $ref: "#/components/parameters/Code" }]
    post:
      tags: [public]
      operationId: unlockTag
      summary: Enter the PIN; get a token that opens the tag for 24 hours
      description: After 5 wrong PINs from one visitor in 15 minutes the tag refuses PINs from that visitor for 15 minutes.
      parameters:
        - $ref: "#/components/parameters/VisitorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { $ref: "#/components/schemas/Pin" }
      responses:
        "200":
          description: Correct PIN
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnlockResult" }
        "403":
          description: Wrong PIN (`wrong_pin`), with `attemptsLeft`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorBody" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The tag is not waiting for a PIN now (`not_pin_protected`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorBody" }
        "422": { $ref: "#/components/responses/Validation" }
        "423":
          description: Too many wrong PINs (`locked`), with `lockedUntil`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorBody" }
  /api/public/tags/{code}/replies:
    parameters: [{ $ref: "#/components/parameters/Code" }]
    post:
      tags: [public]
      operationId: postReply
      summary: Leave a reply on an open tag that allows replies
      parameters:
        - $ref: "#/components/parameters/VisitorId"
        - $ref: "#/components/parameters/UnlockToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplyInput" }
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reply" }
        "403":
          description: The tag is not open to this visitor or replies are off (`replies_closed`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorBody" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
        "429":
          description: More than 10 replies to this tag in the last hour (`too_many_replies`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorBody" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Session token from sign up or log in

  parameters:
    TagId: { name: tagId, in: path, required: true, schema: { type: string } }
    MediaId: { name: mediaId, in: path, required: true, schema: { type: string } }
    MoveId: { name: moveId, in: path, required: true, schema: { type: string } }
    Code:
      name: code
      in: path
      required: true
      description: The tag code from the QR link. Case and spaces are ignored (`7kq4 m2xp` = `7KQ4M2XP`)
      schema: { type: string, example: 7KQ4M2XP }
    VisitorId:
      name: X-Visitor-Id
      in: header
      required: false
      description: Random id the browser keeps in localStorage. Used for PIN attempt limits and scan counting
      schema: { type: string, maxLength: 64 }
    UnlockToken:
      name: X-Unlock-Token
      in: header
      required: false
      description: "`accessToken` from `unlockTag` for this tag"
      schema: { type: string }

  responses:
    Unauthorized:
      description: Missing, unknown or expired session token (`unauthorized`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorBody" }
    NotFound:
      description: No such item, or it belongs to another user (`not_found`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorBody" }
    Validation:
      description: Invalid input (`validation`, or `bad_file` for an unsupported file type). `fields` maps each field to its first message
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorBody" }
          example: { code: validation, message: Title is required, fields: { title: Title is required } }
    EmailTaken:
      description: An account with this email exists (`email_taken`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorBody" }

  schemas:
    ApiErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: "Machine-readable, for example `validation` or `wrong_pin`" }
        message: { type: string, description: Shown to the user as is }
        fields: { type: object, additionalProperties: { type: string } }
        attemptsLeft: { type: integer, minimum: 0 }
        lockedUntil: { type: string, format: date-time, nullable: true }

    TagKind: { type: string, enum: [gift, box, keepsake] }
    Privacy: { type: string, enum: [public, pin, private] }
    Theme: { type: string, enum: [paper, kraft, rose, sage, night, sky] }
    MediaType: { type: string, enum: [photo, video, audio] }
    Pin: { type: string, pattern: "^\\d{4,6}$", example: "1971" }

    SignUpInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 100 }
    LogInInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    User:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        createdAt: { type: string, format: date-time }
    Session:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }

    TagInput:
      type: object
      description: |
        Rules from `tagInputSchema`: strings are trimmed; for kinds other than `box`
        the box fields are cleared; for `box` the recipient is cleared and `moveId`
        and `room` are required. `opensAt`, when it changes, must be in the future.
      required: [kind, title]
      properties:
        kind: { $ref: "#/components/schemas/TagKind" }
        title: { type: string, minLength: 1, maxLength: 80 }
        recipient: { type: string, maxLength: 60, nullable: true }
        message: { type: string, maxLength: 5000, nullable: true }
        theme: { allOf: [{ $ref: "#/components/schemas/Theme" }], default: paper }
        privacy: { allOf: [{ $ref: "#/components/schemas/Privacy" }], default: public }
        pin:
          allOf: [{ $ref: "#/components/schemas/Pin" }]
          nullable: true
          description: Required when switching to `pin`; empty keeps the current PIN. Never returned
        opensAt: { type: string, format: date-time, nullable: true, description: "Time lock. Before this time visitors see only the title, recipient and a countdown" }
        allowReplies: { type: boolean, default: true }
        moveId: { type: string, nullable: true }
        room: { type: string, maxLength: 40, nullable: true }
        contents:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 80 }
          description: Empty items are dropped
        fragile: { type: boolean, default: false }
    Tag:
      type: object
      required: [id, code, kind, title, recipient, message, theme, privacy, hasPin, opensAt, allowReplies, status, moveId, moveName, boxNumber, room, contents, fragile, scanCount, lastScanAt, replyCount, unreadReplies, coverUrl, media, createdAt, updatedAt]
      properties:
        id: { type: string }
        code: { type: string, pattern: "^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{8}$" }
        kind: { $ref: "#/components/schemas/TagKind" }
        title: { type: string }
        recipient: { type: string, nullable: true }
        message: { type: string }
        theme: { $ref: "#/components/schemas/Theme" }
        privacy: { $ref: "#/components/schemas/Privacy" }
        hasPin: { type: boolean }
        opensAt: { type: string, format: date-time, nullable: true }
        allowReplies: { type: boolean }
        status: { type: string, enum: [active, archived] }
        moveId: { type: string, nullable: true }
        moveName: { type: string, nullable: true }
        boxNumber: { type: integer, minimum: 1, nullable: true }
        room: { type: string, nullable: true }
        contents: { type: array, items: { type: string } }
        fragile: { type: boolean }
        scanCount: { type: integer, minimum: 0 }
        lastScanAt: { type: string, format: date-time, nullable: true }
        replyCount: { type: integer, minimum: 0 }
        unreadReplies: { type: integer, minimum: 0 }
        coverUrl: { type: string, nullable: true, description: Signed URL of the first photo }
        media: { type: array, items: { $ref: "#/components/schemas/Media" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Media:
      type: object
      required: [id, type, mimeType, size, caption, position, url, createdAt]
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/MediaType" }
        mimeType: { type: string, example: image/jpeg }
        size: { type: integer, minimum: 1, description: Bytes }
        caption: { type: string, maxLength: 200 }
        position: { type: integer, minimum: 0 }
        url: { type: string, description: Signed URL of the file }
        createdAt: { type: string, format: date-time }
    Stats:
      type: object
      required: [tags, scansThisWeek, unreadReplies]
      properties:
        tags: { type: integer, minimum: 0, description: Active tags }
        scansThisWeek: { type: integer, minimum: 0, description: Scans of my tags in the last 7 days }
        unreadReplies: { type: integer, minimum: 0 }

    ReplyInput:
      type: object
      required: [name, message]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        message: { type: string, minLength: 1, maxLength: 1000 }
    Reply:
      type: object
      required: [id, name, message, read, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        message: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }

    MoveInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        fromAddress: { type: string, maxLength: 120, nullable: true }
        toAddress: { type: string, maxLength: 120, nullable: true }
        date: { type: string, format: date, nullable: true }
    Move:
      type: object
      required: [id, name, fromAddress, toAddress, date, boxCount, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        fromAddress: { type: string, nullable: true }
        toAddress: { type: string, nullable: true }
        date: { type: string, format: date, nullable: true }
        boxCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    MoveDetail:
      allOf:
        - $ref: "#/components/schemas/Move"
        - type: object
          required: [rooms]
          properties:
            rooms:
              type: array
              items:
                type: object
                required: [room, boxes]
                properties:
                  room: { type: string }
                  boxes: { type: array, items: { $ref: "#/components/schemas/Tag" } }
    MoveSearchHit:
      type: object
      required: [tagId, code, title, boxNumber, room, matches]
      properties:
        tagId: { type: string }
        code: { type: string }
        title: { type: string }
        boxNumber: { type: integer, nullable: true }
        room: { type: string, nullable: true }
        matches: { type: array, items: { type: string }, description: Contents items that match }

    PublicMedia:
      type: object
      required: [id, type, mimeType, caption, url]
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/MediaType" }
        mimeType: { type: string }
        caption: { type: string }
        url: { type: string, description: Signed URL of the file }
    PublicTag:
      type: object
      required: [code, kind, title, recipient, message, theme, allowReplies, boxNumber, room, contents, fragile, moveName, media]
      properties:
        code: { type: string }
        kind: { $ref: "#/components/schemas/TagKind" }
        title: { type: string }
        recipient: { type: string, nullable: true }
        message: { type: string }
        theme: { $ref: "#/components/schemas/Theme" }
        allowReplies: { type: boolean }
        boxNumber: { type: integer, nullable: true }
        room: { type: string, nullable: true }
        contents: { type: array, items: { type: string } }
        fragile: { type: boolean }
        moveName: { type: string, nullable: true }
        media: { type: array, items: { $ref: "#/components/schemas/PublicMedia" } }
    PublicTagView:
      oneOf:
        - $ref: "#/components/schemas/ViewSimple"
        - $ref: "#/components/schemas/ViewTimeLocked"
        - $ref: "#/components/schemas/ViewPinRequired"
        - $ref: "#/components/schemas/ViewOpen"
      discriminator:
        propertyName: state
        mapping:
          unknown: "#/components/schemas/ViewSimple"
          archived: "#/components/schemas/ViewSimple"
          private: "#/components/schemas/ViewSimple"
          timeLocked: "#/components/schemas/ViewTimeLocked"
          pinRequired: "#/components/schemas/ViewPinRequired"
          open: "#/components/schemas/ViewOpen"
    ViewSimple:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { type: string, enum: [unknown, archived, private] }
    ViewTimeLocked:
      type: object
      additionalProperties: false
      description: No message and no media before the open date
      required: [state, title, recipient, theme, opensAt]
      properties:
        state: { type: string, enum: [timeLocked] }
        title: { type: string }
        recipient: { type: string, nullable: true }
        theme: { $ref: "#/components/schemas/Theme" }
        opensAt: { type: string, format: date-time }
    ViewPinRequired:
      type: object
      additionalProperties: false
      required: [state, theme, attemptsLeft, lockedUntil]
      properties:
        state: { type: string, enum: [pinRequired] }
        theme: { $ref: "#/components/schemas/Theme" }
        attemptsLeft: { type: integer, minimum: 0, maximum: 5 }
        lockedUntil: { type: string, format: date-time, nullable: true }
    ViewOpen:
      type: object
      additionalProperties: false
      required: [state, preview, tag]
      properties:
        state: { type: string, enum: [open] }
        preview: { type: boolean, description: true when the owner looks at their own tag; not counted as a scan }
        tag: { $ref: "#/components/schemas/PublicTag" }
    UnlockResult:
      type: object
      required: [accessToken, expiresAt]
      properties:
        accessToken: { type: string, description: Send as `X-Unlock-Token` }
        expiresAt: { type: string, format: date-time }
