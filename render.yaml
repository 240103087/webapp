# Render Blueprint: two environments that run the image CI built once (#101). Render never builds and never
# deploys from git: CI pushes ghcr.io/240103087/webapp:<YYYYMMDD-HHMMSS-shortsha> and calls a deploy hook.
#   moveeasy-dev   every green commit on main (.github/workflows/ci.yml, job "Deploy to dev")
#   moveeasy-prod  only through "Promote dev to prod" (.github/workflows/promote.yml), the image dev ran
# Free plan only. Steps, secrets and limits: deploy/render/README.md and _docs/devops.md
services:
  - type: web
    name: moveeasy-dev
    runtime: image
    plan: free
    image:
      url: ghcr.io/240103087/webapp:dev
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: dev
      # SQLite inside the container (the image's default DATABASE_URL), demo data loaded on every start
      - key: SEED
        value: "1"
      - key: MEDIA_SECRET
        generateValue: true
      # OpenTelemetry to Grafana Cloud (#103): set these two in the dashboard, they are secrets
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false

  - type: web
    name: moveeasy-prod
    runtime: image
    plan: free
    image:
      url: ghcr.io/240103087/webapp:prod
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: moveeasy-db
          property: connectionString
      - key: SEED
        value: "1"
      - key: MEDIA_SECRET
        generateValue: true
      # The free plan has no persistent disk: uploaded files are lost when the service restarts
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false

databases:
  - name: moveeasy-db
    plan: free
    databaseName: moveeasy
    user: moveeasy
