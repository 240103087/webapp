# CI/CD (#75, #101): tests in parallel, then the Compose stack. On main, the image is built once, pushed to the
# registry with a unique tag and deployed to the dev environment. Prod changes only through promote.yml (#102).
name: CI
on:
  push:
  pull_request:
  workflow_dispatch: # "Run workflow" on main deploys again by hand

jobs:
  frontend:
    name: Frontend and shared tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w shared
      - run: npm test -w frontend

  backend:
    name: Backend tests (memory, SQLite, Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moveeasy
          POSTGRES_PASSWORD: moveeasy
          POSTGRES_DB: moveeasy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moveeasy" --health-interval 3s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w backend
      - run: npm run test:postgres -w backend
        env:
          TEST_POSTGRES_URL: postgresql://moveeasy:moveeasy@localhost:5432/moveeasy

  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: End-to-end tests (npm start, SQLite)
    # Playwright 1.56 cannot install Chromium on ubuntu-latest (26.04) yet
    runs-on: ubuntu-24.04
    needs: [frontend, backend, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/

  stack:
    name: Docker Compose stack (Postgres) - integration and end-to-end tests
    # Playwright 1.56 cannot install Chromium on ubuntu-latest (26.04) yet
    runs-on: ubuntu-24.04
    needs: [frontend, backend, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run test:stack
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stack-playwright-traces
          path: e2e/test-results/

  image:
    name: Build the image once and push it
    runs-on: ubuntu-latest
    needs: [e2e, stack]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write # GitHub Container Registry, with the workflow's own token
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag it YYYYMMDD-HHMMSS-shortsha
        id: meta
        run: |
          tag="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Image: \`$image:$tag\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:dev
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # One plain image manifest, no attestation index: `imagetools create` (the :prod tag here and in
          # promote.yml) failed to copy the attestation manifest on GHCR ("manifests/sha256:... not found")
          provenance: false
          sbom: false
      - name: First run only - give prod an image to start from
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if ! docker buildx imagetools inspect "$IMAGE:prod" > /dev/null 2>&1; then
            docker buildx imagetools create -t "$IMAGE:prod" "$IMAGE:$TAG"
            echo "No :prod image yet: tagged $TAG as prod so the Render service can be created" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    needs: image
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    environment:
      name: development
      url: ${{ vars.DEV_URL || 'https://moveeasy-dev.onrender.com' }}
    env:
      DEV_URL: ${{ vars.DEV_URL || 'https://moveeasy-dev.onrender.com' }}
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_DEV }}
      IMAGE: ${{ needs.image.outputs.image }}
      TAG: ${{ needs.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the new image through the Render deploy hook
        id: hook
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_DEV is not set, dev was not deployed (see _docs/devops.md)"
            exit 0
          fi
          img=$(jq -rn --arg u "$IMAGE:$TAG" '$u|@uri')
          curl -fsS -X POST "$HOOK&imgURL=$img" -o /dev/null
          echo "deployed=1" >> "$GITHUB_OUTPUT"
      - name: Wait until dev runs it
        if: steps.hook.outputs.deployed == '1'
        run: |
          scripts/wait-for-version.sh "$DEV_URL" "$TAG"
          echo "dev ($DEV_URL) runs \`$TAG\`. Promote it with Actions > Promote dev to prod." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [e2e, stack]
    # Only main, and only once the repository variables from deploy/aws/README.md are set
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write # GitHub OIDC token for AWS, no keys stored in GitHub
      contents: read
    env:
      STACK: ${{ vars.AWS_STACK_NAME || 'moveeasy' }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Read the stack outputs
        id: stack
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "instance=$(out InstanceId)" >> "$GITHUB_OUTPUT"
          echo "url=$(out AppUrl)" >> "$GITHUB_OUTPUT"

      - name: Deploy this commit on the instance
        env:
          INSTANCE: ${{ steps.stack.outputs.instance }}
        run: |
          id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7}" --timeout-seconds 600 \
            --parameters "{\"commands\":[\"bash /opt/moveeasy/deploy/aws/deploy.sh $GITHUB_SHA\"],\"executionTimeout\":[\"1800\"]}" \
            --query Command.CommandId --output text)
          echo "SSM command $id"
          status=Pending
          for i in $(seq 1 120); do
            sleep 15
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            echo "$status"
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query StandardOutputContent --output text | tail -n 40
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query StandardErrorContent --output text | tail -n 40
          test "$status" = Success

      - name: Check the health endpoint
        env:
          URL: ${{ steps.stack.outputs.url }}
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL/api/health" || true)
            echo "$URL/api/health -> $code"
            if [ "$code" = 200 ]; then exit 0; fi
            sleep 5
          done
          echo "The app did not answer 200 within 5 minutes"
          exit 1
