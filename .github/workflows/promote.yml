# Promote dev to prod (#102): by hand only. Deploys to prod the exact image dev runs (or a tag you name);
# nothing is rebuilt. Actions > "Promote dev to prod" > Run workflow. To roll back, promote an older tag.
name: Promote dev to prod
run-name: Promote ${{ inputs.version || 'what dev runs' }} to prod

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to promote, like 20261115-130501-abc1234. Empty: the version dev runs now"
        required: false
        default: ""
      confirm:
        description: "Yes, deploy this version to production"
        type: boolean
        required: true
        default: false
      release:
        description: "Optional release tag, like v1.2.0 (creates a GitHub release)"
        required: false
        default: ""

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  promote:
    name: Promote to prod
    runs-on: ubuntu-latest
    # A required reviewer can be added to this environment in Settings > Environments > production
    environment:
      name: production
      url: ${{ vars.PROD_URL || 'https://moveeasy-prod.onrender.com' }}
    permissions:
      contents: write # the release
      packages: write # retag the image
    env:
      DEV_URL: ${{ vars.DEV_URL || 'https://moveeasy-dev.onrender.com' }}
      PROD_URL: ${{ vars.PROD_URL || 'https://moveeasy-prod.onrender.com' }}
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PROD }}
      VERSION: ${{ inputs.version }}
      RELEASE: ${{ inputs.release }}
    steps:
      - name: Check the confirmation
        if: ${{ !inputs.confirm }}
        run: |
          echo "::error::Tick 'Yes, deploy this version to production' to promote"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Which version
        id: v
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -fsS --retry 5 --retry-delay 10 --max-time 60 "$DEV_URL/api/health" | jq -r .version)
            echo "dev runs $VERSION"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]{8}-[0-9]{6}-[0-9a-f]{7}$ ]]; then
            echo "::error::'$VERSION' is not an image tag like 20261115-130501-abc1234"
            exit 1
          fi
          if [ -n "$RELEASE" ] && ! [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The release tag must look like v1.2.0"
            exit 1
          fi
          previous=$(curl -s --max-time 60 "$PROD_URL/api/health" | jq -r '.version // "unknown"' 2>/dev/null || echo unknown)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the image exists and tag it prod
        env:
          IMAGE: ${{ steps.v.outputs.image }}
          TAG: ${{ steps.v.outputs.version }}
        run: |
          if ! docker buildx imagetools inspect "$IMAGE:$TAG" > /dev/null; then
            echo "::error::$IMAGE:$TAG is not in the registry"
            exit 1
          fi
          extra=()
          if [ -n "$RELEASE" ]; then extra=(-t "$IMAGE:$RELEASE"); fi
          docker buildx imagetools create -t "$IMAGE:prod" "${extra[@]}" "$IMAGE:$TAG"

      - name: Deploy it to prod through the Render deploy hook
        env:
          IMAGE: ${{ steps.v.outputs.image }}
          TAG: ${{ steps.v.outputs.version }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Set the RENDER_DEPLOY_HOOK_PROD secret (see _docs/devops.md)"
            exit 1
          fi
          img=$(jq -rn --arg u "$IMAGE:$TAG" '$u|@uri')
          curl -fsS -X POST "$HOOK&imgURL=$img" -o /dev/null

      - name: Wait until prod runs it
        run: scripts/wait-for-version.sh "$PROD_URL" "${{ steps.v.outputs.version }}"

      - name: Release
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.version }}
        run: |
          sha=$(git rev-parse "${TAG##*-}^{commit}")
          gh release create "$RELEASE" --target "$sha" --title "$RELEASE" \
            --notes "Promoted to production: image \`${{ steps.v.outputs.image }}:$TAG\` (commit $sha). Previous prod version: ${{ steps.v.outputs.previous }}." \
            --generate-notes

      - name: Summary
        run: |
          {
            echo "### Prod runs \`${{ steps.v.outputs.version }}\`"
            echo ""
            echo "- Image: \`${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}\` (also \`:prod\`)"
            echo "- Before: \`${{ steps.v.outputs.previous }}\` (promote it again to roll back)"
            echo "- $PROD_URL"
            if [ -n "$RELEASE" ]; then echo "- Release $RELEASE"; fi
          } >> "$GITHUB_STEP_SUMMARY"
